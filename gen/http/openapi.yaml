            agent_id:
                type: string
                description: Scoped agent container identifier.
                example: Hic dolores temporibus at tempora recusandae.
            cache_after_system:
                type: boolean
                description: True when prompt caching places a checkpoint after system prompts.
                example: true
            cache_after_tools:
                type: boolean
                description: True when prompt caching places a checkpoint after tool definitions.
                example: false
            compress_at_turns:
                type: integer
                description: Turn threshold for history compression.
                example: 2961075941365311475
                format: int64
            keep_recent_turns:
                type: integer
                description: Recent turns retained uncompressed.
                example: 8141624799624588935
                format: int64
            max_execution_seconds:
                type: integer
                description: Per-run execution time budget in seconds.
                example: 9164198126331039093
                format: int64
            max_recovery_turns:
                type: integer
                description: Maximum consecutive recovery turns after validation failure.
                example: 1479075455329254996
                format: int64
            max_tool_calls:
                type: integer
                description: Per-run retrieval tool-call budget.
                example: 7430104826542814714
                format: int64
        description: Evaluated Goa-AI cost, safety, history, and cache policy for a single agent.
        example:
            agent_id: Hic dolores temporibus at tempora recusandae.
            cache_after_system: true
            cache_after_tools: false
            compress_at_turns: 2961075941365311475
            keep_recent_turns: 8141624799624588935
            max_execution_seconds: 9164198126331039093
            max_recovery_turns: 1479075455329254996
            max_tool_calls: 7430104826542814714
        required:
            - agent_id
            - max_execution_seconds
            - max_tool_calls
            - max_recovery_turns
            - compress_at_turns
            - keep_recent_turns
            - cache_after_system
            - cache_after_tools
