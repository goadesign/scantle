swagger: "2.0"
info:
    title: Surla MCP Software Factory Control Plane
    description: MCP-native control plane for creating, verifying, and evolving production Goa-AI agentic platforms.
    version: 1.0.0
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /changes/{change_id}:
        get:
            tags:
                - surla
            summary: get_change surla
            description: Return the current Change Card, including its request_revision, to its owner, for example after confirm_intent refused an edit made against an older revision. Reading never confirms or changes the card. A recorded approval is included only while it still matches the promotion target's current suite, environment and binary digests; the call fails when the card has an approval and the target cannot report them.
            operationId: surla#get_change
            parameters:
                - name: change_id
                  in: path
                  description: Change identifier.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
            schemes:
                - http
    /changes/approve:
        post:
            tags:
                - surla
            summary: approve_merge surla
            description: Record Checkpoint 5 approval for the owner's confirmed Change Card revision. The control plane loads the verification report by digest and the expected suite, environment and candidate binary digests from its promotion target, re-derives the report from its evidence with verify.Approve, and records the approval on the card. A report that did not pass or describes different inputs is rejected. Nothing is merged or deployed. The promotion target is provided by the program that embeds the control plane; a control plane without one, such as standalone surla serve, rejects every call.
            operationId: surla#approve_merge
            parameters:
                - name: approve_merge_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ApproveMergePayload'
                    required:
                        - change_id
                        - request_revision
                        - candidate_commit
                        - report_digest
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
            schemes:
                - http
    /changes/confirm:
        post:
            tags:
                - surla
            summary: confirm_intent surla
            description: Confirm or refine a Checkpoint 1 Change Card with the complete ambiguity answers and example table, bound to its current request_revision. Changed answers or examples produce a new request_revision; unchanged ones return the card as it is, with its approval only while that approval still matches the promotion target's current inputs. The call fails when the card has an approval and the promotion target cannot report its current inputs.
            operationId: surla#confirm_intent
            parameters:
                - name: confirm_intent_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ConfirmIntentPayload'
                    required:
                        - change_id
                        - request_revision
                        - answers
                        - examples
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
            schemes:
                - http
    /changes/preview:
        post:
            tags:
                - surla
            summary: preview_architecture surla
            description: Extract and validate the Checkpoint 2 C4 container topology, tool contracts, Goa-AI guardrails, and proposed Chorus swarm roster from a candidate Goa design bound to a confirmed Change Card.
            operationId: surla#preview_architecture
            parameters:
                - name: preview_architecture_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/PreviewArchitecturePayload'
                    required:
                        - change_id
                        - request_revision
                        - design
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ArchitecturePreviewResult'
                        required:
                            - change_id
                            - request_revision
                            - design_digest
                            - system_name
                            - containers
                            - edges
                            - agent_policies
                            - tools
                            - swarm
                            - banner
            schemes:
                - http
    /changes/propose:
        post:
            tags:
                - surla
            summary: propose_change surla
            description: Evaluate a feature request at Checkpoint 1, surfacing concrete examples and any genuine domain ambiguity.
            operationId: surla#propose_change
            parameters:
                - name: propose_change_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ProposeChangePayload'
                    required:
                        - change_id
                        - prompt
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
            schemes:
                - http
    /diff:
        post:
            tags:
                - surla
            summary: diff surla
            description: Compare evaluated Goa designs and go.mod directives without emitting a blanket compatibility verdict.
            operationId: surla#diff
            parameters:
                - name: DiffRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/DiffPayload'
                    required:
                        - old
                        - new
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/DiffResult'
                        required:
                            - has_changes
                            - added_declarations
                            - removed_declarations
                            - modified_declarations
                            - version_deltas
                            - summary
            schemes:
                - http
    /golden-path:
        get:
            tags:
                - surla
            summary: golden_path surla
            description: Serve the Surla Golden Path architecture playbook for Goa-AI agentic platforms.
            operationId: surla#golden_path
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /sandbox/draft:
        post:
            tags:
                - surla
            summary: draft_override surla
            description: Apply a Fast Draft Mode prompt override on the bound target or reject a compiled-rule prompt hack.
            operationId: surla#draft_override
            parameters:
                - name: draft_override_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/DraftOverridePayload'
                    required:
                        - target_kind
                        - new_content
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/DraftOverrideResult'
                        required:
                            - applied_in_store
                            - requires_rebuild
                            - message
            schemes:
                - http
    /ui/checkpoint:
        get:
            tags:
                - surla
            summary: checkpoint_ui surla
            description: Serve the interactive MCP Apps HTML host for Surla checkpoints.
            operationId: surla#checkpoint_ui
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
definitions:
    AgentPolicyItem:
        title: AgentPolicyItem
        type: object
