            approved_by: Quia fuga rem fugiat quasi.
            artifacts:
                Aspernatur fugit quam.: Minus nesciunt.
            candidate_commit: Explicabo necessitatibus esse cumque.
            environment: Illum sequi ducimus mollitia esse.
            report_digest: Harum rem sequi harum quis.
            scenario_count: 675343994147794327
            suite_commit: Voluptatem et placeat ullam quisquam.
            suite_id: Accusantium quae ducimus.
        required:
            - approved_by
            - report_digest
            - candidate_commit
            - suite_id
            - suite_commit
            - environment
            - artifacts
            - scenario_count
