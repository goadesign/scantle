swagger: "2.0"
info:
    title: Scantle MCP Software Factory
    description: Design-first MCP control plane for creating, verifying, and evolving production agentic platforms on the Goa Design suite.
    version: 1.0.0
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /changes/confirm:
        post:
            tags:
                - scantle
            summary: confirm_intent scantle
            description: Confirm Checkpoint 1 answers and examples to freeze the Change Card.
            operationId: scantle#confirm_intent
            parameters:
                - name: confirm_intent_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ConfirmIntentPayload'
                    required:
                        - change_id
                        - answers
                        - examples
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
            schemes:
                - http
    /changes/preview:
        post:
            tags:
                - scantle
            summary: preview_architecture scantle
            description: Extract and validate the Checkpoint 2 C4 container topology and Goa-AI guardrails from a candidate Goa design bound to a confirmed Change Card.
            operationId: scantle#preview_architecture
            parameters:
                - name: preview_architecture_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/PreviewArchitecturePayload'
                    required:
                        - change_id
                        - request_revision
                        - design_source
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ArchitecturePreviewResult'
                        required:
                            - change_id
                            - request_revision
                            - design_digest
                            - system_name
                            - containers
                            - edges
                            - guardrails
                            - banner
            schemes:
                - http
    /changes/propose:
        post:
            tags:
                - scantle
            summary: propose_change scantle
            description: Evaluate a feature request at Checkpoint 1, surfacing concrete examples and any genuine domain ambiguity.
            operationId: scantle#propose_change
            parameters:
                - name: propose_change_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ProposeChangePayload'
                    required:
                        - change_id
                        - prompt
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChangeCardResult'
                        required:
                            - change_id
                            - status
                            - prompt
                            - summary
                            - examples
                            - preserved_behaviors
                            - request_revision
            schemes:
                - http
    /diff:
        post:
            tags:
                - scantle
            summary: diff scantle
            description: Compare Goa design ASTs and go.mod directives without emitting a blanket compatibility verdict.
            operationId: scantle#diff
            parameters:
                - name: DiffRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/DiffPayload'
                    required:
                        - old_design
                        - new_design
                        - old_gomod
                        - new_gomod
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/DiffResult'
                        required:
                            - has_changes
                            - added_declarations
                            - removed_declarations
                            - modified_declarations
                            - version_deltas
                            - summary
            schemes:
                - http
    /sandbox/draft:
        post:
            tags:
                - scantle
            summary: draft_override scantle
            description: Apply a Fast Draft Mode prompt override on the bound target or reject a compiled-rule prompt hack.
            operationId: scantle#draft_override
            parameters:
                - name: draft_override_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/DraftOverridePayload'
                    required:
                        - target_kind
                        - new_content
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/DraftOverrideResult'
                        required:
                            - applied_in_store
                            - requires_rebuild
                            - message
            schemes:
                - http
    /ui/checkpoint:
        get:
            tags:
                - scantle
            summary: checkpoint_ui scantle
            description: Serve the interactive MCP Apps HTML host for Scantle checkpoints.
            operationId: scantle#checkpoint_ui
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
