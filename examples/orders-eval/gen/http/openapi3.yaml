openapi: 3.0.3
info:
    title: Orders reference platform (approved public contract)
    version: 0.0.1
servers:
    - url: http://localhost:80
      description: Default server for orders
paths:
    /chat:
        post:
            tags:
                - orders
            summary: chat orders
            description: Send a message to the refund assistant and start a run.
            operationId: orders#chat
            requestBody:
                description: Request body for chat.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChatRequestBody'
                        example:
                            message: r7
            responses:
                "202":
                    description: Accepted response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RunView'
                            example:
                                approval_id: Vel dolores aut dolore tempora deserunt.
                                approval_prompt: Consequuntur eveniet at.
                                reply: Doloremque deleniti.
                                run_id: Iste aut enim et in beatae.
                                status: running
                "401":
                    description: 'unauthorized: The bearer token is missing or invalid.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "403":
                    description: 'forbidden: The caller may not perform this action.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: forbidden
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The run or approval does not exist.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
            security:
                - jwt_header_Authorization: []
    /runs/{run_id}:
        get:
            tags:
                - orders
            summary: run_status orders
            description: Read the state of a run the caller started.
            operationId: orders#run_status
            parameters:
                - name: run_id
                  in: path
                  description: Run to read.
                  required: true
                  schema:
                    type: string
                    description: Run to read.
                    example: hc
                    minLength: 1
                  example: hc
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RunView'
                            example:
                                approval_id: Molestiae quis sint provident hic minus praesentium.
                                approval_prompt: Quia et rerum cupiditate quis.
                                reply: Voluptatibus illo enim atque beatae nam.
                                run_id: Aliquam delectus deleniti tempore mollitia velit.
                                status: running
                "401":
                    description: 'unauthorized: The bearer token is missing or invalid.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "403":
                    description: 'forbidden: The caller may not perform this action.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: forbidden
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The run or approval does not exist.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
            security:
                - jwt_header_Authorization: []
    /runs/{run_id}/approval:
        post:
            tags:
                - orders
            summary: approve_refund orders
            description: Approve or deny a refund that is waiting for a manager.
            operationId: orders#approve_refund
            parameters:
                - name: run_id
                  in: path
                  description: Run waiting for approval.
                  required: true
                  schema:
                    type: string
                    description: Run waiting for approval.
                    example: mq8
                    minLength: 1
                  example: mq8
            requestBody:
                description: Request body for approve_refund.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApproveRefundRequestBody'
                        example:
                            approval_id: 2lg
                            approved: true
            responses:
                "202":
                    description: Accepted response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RunView'
                            example:
                                approval_id: Aut recusandae autem aliquam maxime ea.
                                approval_prompt: Dolorum similique labore quae hic in.
                                reply: Error quo eos ratione quis sint.
                                run_id: Aut placeat quia.
                                status: failed
                "401":
                    description: 'unauthorized: The bearer token is missing or invalid.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: unauthorized
                                temporary: false
                                timeout: false
                "403":
                    description: 'forbidden: The caller may not perform this action.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: forbidden
                                temporary: false
                                timeout: false
                "404":
                    description: 'not_found: The run or approval does not exist.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
            security:
                - jwt_header_Authorization: []
    /tenants/{tenant_id}/customers/{customer_id}/orders:
        get:
            tags:
                - commerce
            summary: list_orders commerce
            description: List one page of a customer's orders, newest first.
            operationId: commerce#list_orders
            parameters:
                - name: cursor
                  in: query
                  description: Cursor returned by the previous page.
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: Cursor returned by the previous page.
                    example: Saepe excepturi est accusantium assumenda adipisci iste.
                  example: Saepe excepturi est accusantium assumenda adipisci iste.
                - name: limit
                  in: query
                  description: Maximum orders to return.
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Maximum orders to return.
                    default: 20
                    example: 43
                    format: int64
                    minimum: 1
                    maximum: 50
                  example: 43
                - name: tenant_id
                  in: path
                  description: Merchant tenant.
                  required: true
                  schema:
                    type: string
                    description: Merchant tenant.
                    example: w
                    minLength: 1
                  example: w
                - name: customer_id
                  in: path
                  description: Customer whose orders to list.
                  required: true
                  schema:
                    type: string
                    description: Customer whose orders to list.
                    example: l
                    minLength: 1
                  example: l
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderPage'
                            example:
                                next_cursor: Saepe praesentium ut quia.
                                orders:
                                    - id: "0"
                                      items_cents: 3150286796042693468
                                      placed_at: "2008-09-21T01:31:00Z"
                                      shipping_cents: 6193610867283962899
                                      tax_cents: 5943857639072305571
                                      total_cents: 6277315588612917884
                                    - id: "0"
                                      items_cents: 3150286796042693468
                                      placed_at: "2008-09-21T01:31:00Z"
                                      shipping_cents: 6193610867283962899
                                      tax_cents: 5943857639072305571
                                      total_cents: 6277315588612917884
                                    - id: "0"
                                      items_cents: 3150286796042693468
                                      placed_at: "2008-09-21T01:31:00Z"
                                      shipping_cents: 6193610867283962899
                                      tax_cents: 5943857639072305571
                                      total_cents: 6277315588612917884
                                    - id: "0"
                                      items_cents: 3150286796042693468
                                      placed_at: "2008-09-21T01:31:00Z"
                                      shipping_cents: 6193610867283962899
                                      tax_cents: 5943857639072305571
                                      total_cents: 6277315588612917884
                                total: 8917658905915546728
    /tenants/{tenant_id}/customers/{customer_id}/orders/{order_id}:
        get:
            tags:
                - commerce
            summary: get_order commerce
            description: Load one of a customer's orders. Orders of other customers are not found.
            operationId: commerce#get_order
            parameters:
                - name: tenant_id
                  in: path
                  description: Merchant tenant.
                  required: true
                  schema:
                    type: string
                    description: Merchant tenant.
                    example: lod
                    minLength: 1
                  example: lod
                - name: customer_id
                  in: path
                  description: Customer who must own the order.
                  required: true
                  schema:
                    type: string
                    description: Customer who must own the order.
                    example: zu
                    minLength: 1
                  example: zu
                - name: order_id
                  in: path
                  description: Order to load.
                  required: true
                  schema:
                    type: string
                    description: Order to load.
                    example: t
                    minLength: 1
                  example: t
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                            example:
                                id: 9qx
                                items_cents: 8501862368368123323
                                placed_at: "2012-12-01T11:20:09Z"
                                shipping_cents: 6486290811802831612
                                tax_cents: 7645902224622136067
                                total_cents: 5903079118353159991
                "404":
                    description: 'not_found: The customer has no such order.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: not_found
                                temporary: false
                                timeout: false
    /tenants/{tenant_id}/refunds:
        post:
            tags:
                - payments
            summary: refund payments
            description: Refund an order. A repeated idempotency key returns the original receipt.
            operationId: payments#refund
            parameters:
                - name: tenant_id
                  in: path
                  description: Merchant tenant.
                  required: true
                  schema:
                    type: string
                    description: Merchant tenant.
                    example: ri
                    minLength: 1
                  example: ri
                - name: Idempotency-Key
                  in: header
                  description: Key that identifies this refund across retries.
                  required: true
                  schema:
                    type: string
                    description: Key that identifies this refund across retries.
                    example: kgt
                    minLength: 1
                  example: kgt
            requestBody:
                description: Request body for refund.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefundRequestBody'
                        example:
                            amount_cents: 526595256696119958
                            method: store_credit
                            order_id: 7g
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Receipt'
                            example:
                                amount_cents: 8316934806901576493
                                method: store_credit
                                order_id: zq
                                receipt_id: "1"
components:
    schemas:
        ApproveRefundRequestBody:
            type: object
            properties:
                approval_id:
                    type: string
                    description: Approval being decided, as reported by run_status.
                    example: 2lg
                    minLength: 1
                approved:
                    type: boolean
                    description: Whether the refund is approved.
                    example: true
            description: Request body for approve_refund.
            example:
                approval_id: 2lg
                approved: true
            required:
                - approval_id
                - approved
        ChatRequestBody:
            type: object
            properties:
                message:
                    type: string
                    description: What the customer says.
                    example: r7
                    minLength: 1
            description: Request body for chat.
            example:
                message: r7
            required:
                - message
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: false
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: true
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: true
            description: Error response result type
            example:
                fault: false
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: true
                timeout: true
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        Order:
            type: object
            properties:
                id:
                    type: string
                    description: Order identifier.
                    example: "0"
                    minLength: 1
                items_cents:
                    type: integer
                    description: Item subtotal in cents.
                    example: 3150286796042693468
                    format: int64
                    minimum: 0
                placed_at:
                    type: string
                    description: When the order was placed.
                    example: "2008-09-21T01:31:00Z"
                    format: date-time
                shipping_cents:
                    type: integer
                    description: Shipping charged in cents.
                    example: 6193610867283962899
                    format: int64
                    minimum: 0
                tax_cents:
                    type: integer
                    description: Tax charged in cents.
                    example: 5943857639072305571
                    format: int64
                    minimum: 0
                total_cents:
                    type: integer
                    description: Total charged in cents, including tax and shipping.
                    example: 6277315588612917884
                    format: int64
                    minimum: 0
            description: A customer order with its charged amounts in cents.
            example:
                id: "0"
                items_cents: 3150286796042693468
                placed_at: "2008-09-21T01:31:00Z"
                shipping_cents: 6193610867283962899
                tax_cents: 5943857639072305571
                total_cents: 6277315588612917884
            required:
                - id
                - placed_at
                - items_cents
                - tax_cents
                - shipping_cents
                - total_cents
        OrderPage:
            type: object
            properties:
                next_cursor:
                    type: string
                    description: Cursor for the next page; absent on the last page.
                    example: Saepe praesentium ut quia.
                orders:
                    type: array
                    items:
                        $ref: '#/components/schemas/Order'
                    description: Orders on this page.
                    example:
                        - id: "0"
                          items_cents: 3150286796042693468
                          placed_at: "2008-09-21T01:31:00Z"
                          shipping_cents: 6193610867283962899
                          tax_cents: 5943857639072305571
                          total_cents: 6277315588612917884
                        - id: "0"
                          items_cents: 3150286796042693468
                          placed_at: "2008-09-21T01:31:00Z"
                          shipping_cents: 6193610867283962899
                          tax_cents: 5943857639072305571
                          total_cents: 6277315588612917884
                        - id: "0"
                          items_cents: 3150286796042693468
                          placed_at: "2008-09-21T01:31:00Z"
                          shipping_cents: 6193610867283962899
                          tax_cents: 5943857639072305571
                          total_cents: 6277315588612917884
                        - id: "0"
                          items_cents: 3150286796042693468
                          placed_at: "2008-09-21T01:31:00Z"
                          shipping_cents: 6193610867283962899
                          tax_cents: 5943857639072305571
                          total_cents: 6277315588612917884
                total:
                    type: integer
                    description: Number of orders the customer has in total.
                    example: 8917658905915546728
                    format: int64
                    minimum: 0
            description: One page of a customer's orders, newest first.
            example:
                next_cursor: Saepe praesentium ut quia.
                orders:
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
                total: 8917658905915546728
            required:
                - orders
                - total
        Receipt:
            type: object
            properties:
                amount_cents:
                    type: integer
                    description: Refunded amount in cents.
                    example: 8316934806901576493
                    format: int64
                    minimum: 1
                method:
                    type: string
                    description: How the money was returned.
                    example: store_credit
                    enum:
                        - store_credit
                        - card
                order_id:
                    type: string
                    description: Refunded order.
                    example: zq
                    minLength: 1
                receipt_id:
                    type: string
                    description: Provider receipt identifier.
                    example: "1"
                    minLength: 1
            description: The payment provider's record of a refund.
            example:
                amount_cents: 8316934806901576493
                method: store_credit
                order_id: zq
                receipt_id: "1"
            required:
                - receipt_id
                - order_id
                - amount_cents
                - method
        RefundRequestBody:
            type: object
            properties:
                amount_cents:
                    type: integer
                    description: Amount to refund in cents.
                    example: 526595256696119958
                    format: int64
                    minimum: 1
                method:
                    type: string
                    description: How to return the money.
                    example: store_credit
                    enum:
                        - store_credit
                        - card
                order_id:
                    type: string
                    description: Order to refund.
                    example: 7g
                    minLength: 1
            description: Request body for refund.
            example:
                amount_cents: 526595256696119958
                method: store_credit
                order_id: 7g
            required:
                - order_id
                - amount_cents
                - method
        RunView:
            type: object
            properties:
                approval_id:
                    type: string
                    description: Pending approval to decide when status is awaiting_approval.
                    example: Vel dolores aut dolore tempora deserunt.
                approval_prompt:
                    type: string
                    description: What the manager is asked to approve.
                    example: Consequuntur eveniet at.
                reply:
                    type: string
                    description: Assistant reply once the run completes.
                    example: Doloremque deleniti.
                run_id:
                    type: string
                    description: Run identifier.
                    example: Iste aut enim et in beatae.
                status:
                    type: string
                    description: Run state.
                    example: running
                    enum:
                        - running
                        - awaiting_approval
                        - completed
                        - failed
            description: State of a refund assistant run.
            example:
                approval_id: Vel dolores aut dolore tempora deserunt.
                approval_prompt: Consequuntur eveniet at.
                reply: Doloremque deleniti.
                run_id: Iste aut enim et in beatae.
                status: running
            required:
                - run_id
                - status
    securitySchemes:
        jwt_header_Authorization:
            type: http
            description: Bearer token issued by the merchant's identity provider.
            scheme: bearer
            bearerFormat: JWT
tags:
    - name: orders
      description: Refund assistant for a merchant's customers.
    - name: commerce
      description: 'External order system: lists a customer''s orders.'
    - name: payments
      description: 'External payment provider: issues refunds exactly once per idempotency key.'
