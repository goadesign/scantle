swagger: "2.0"
info:
    title: Orders reference platform
    description: Refund assistant used as Surla's reference target under test.
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /chat:
        post:
            tags:
                - orders
            summary: chat orders
            description: |-
                Send a message to the refund assistant and start a run.

                **Required security scopes for jwt**:
                  * `orders:chat`
            operationId: orders#chat
            parameters:
                - name: ChatRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OrdersChatRequestBody'
                    required:
                        - message
            responses:
                "202":
                    description: Accepted response.
                    schema:
                        $ref: '#/definitions/RunView'
                        required:
                            - run_id
                            - status
                "401":
                    description: 'unauthorized: The bearer token is missing or invalid.'
                    schema:
                        $ref: '#/definitions/OrdersChatUnauthorizedResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unauthorized
                            temporary: false
                            timeout: false
                "403":
                    description: 'forbidden: The caller may not perform this action.'
                    schema:
                        $ref: '#/definitions/OrdersChatForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: The run or approval does not exist.'
                    schema:
                        $ref: '#/definitions/OrdersChatNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "422":
                    description: 'invalid_refund: The refund breaks a business rule.'
                    schema:
                        $ref: '#/definitions/OrdersChatInvalidRefundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: invalid_refund
                            temporary: false
                            timeout: false
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /prompts/{prompt_id}:
        put:
            tags:
                - orders
            summary: override_prompt orders
            description: |-
                Replace the text of a registered prompt for every tenant served by this orders process. The agent's next model request planned by this process uses the new text. The change lasts until the process restarts, which restores the built-in text; other running orders processes keep their own prompts.

                **Required security scopes for jwt**:
                  * `prompts:manage`
            operationId: orders#override_prompt
            parameters:
                - name: prompt_id
                  in: path
                  description: Registered prompt to replace.
                  required: true
                  type: string
                  minLength: 1
                - name: override_prompt_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OrdersOverridePromptRequestBody'
                    required:
                        - template
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/PromptVersion'
                        required:
                            - prompt_id
                            - version
                "401":
                    description: 'unauthorized: The bearer token is missing or invalid.'
                    schema:
                        $ref: '#/definitions/OrdersOverridePromptUnauthorizedResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unauthorized
                            temporary: false
                            timeout: false
                "403":
                    description: 'forbidden: The caller may not perform this action.'
                    schema:
                        $ref: '#/definitions/OrdersOverridePromptForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: The run or approval does not exist.'
                    schema:
                        $ref: '#/definitions/OrdersOverridePromptNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "422":
                    description: 'invalid_refund: The refund breaks a business rule.'
                    schema:
                        $ref: '#/definitions/OrdersOverridePromptInvalidRefundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: invalid_refund
                            temporary: false
                            timeout: false
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /runs/{run_id}:
        get:
            tags:
                - orders
            summary: run_status orders
            description: |-
                Read the state of a run the caller started.

                **Required security scopes for jwt**:
                  * `orders:chat`
            operationId: orders#run_status
            parameters:
                - name: run_id
                  in: path
                  description: Run to read.
                  required: true
                  type: string
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/RunView'
                        required:
                            - run_id
                            - status
                "401":
                    description: 'unauthorized: The bearer token is missing or invalid.'
                    schema:
                        $ref: '#/definitions/OrdersRunStatusUnauthorizedResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unauthorized
                            temporary: false
                            timeout: false
                "403":
                    description: 'forbidden: The caller may not perform this action.'
                    schema:
                        $ref: '#/definitions/OrdersRunStatusForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: The run or approval does not exist.'
                    schema:
                        $ref: '#/definitions/OrdersRunStatusNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "422":
                    description: 'invalid_refund: The refund breaks a business rule.'
                    schema:
                        $ref: '#/definitions/OrdersRunStatusInvalidRefundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: invalid_refund
                            temporary: false
                            timeout: false
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /runs/{run_id}/approval:
        post:
            tags:
                - orders
            summary: approve_refund orders
            description: |-
                Approve or deny a refund that is waiting for a manager.

                **Required security scopes for jwt**:
                  * `refunds:approve`
            operationId: orders#approve_refund
            parameters:
                - name: run_id
                  in: path
                  description: Run waiting for approval.
                  required: true
                  type: string
                  minLength: 1
                - name: approve_refund_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OrdersApproveRefundRequestBody'
                    required:
                        - approval_id
                        - approved
            responses:
                "202":
                    description: Accepted response.
                    schema:
                        $ref: '#/definitions/RunView'
                        required:
                            - run_id
                            - status
                "401":
                    description: 'unauthorized: The bearer token is missing or invalid.'
                    schema:
                        $ref: '#/definitions/OrdersApproveRefundUnauthorizedResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unauthorized
                            temporary: false
                            timeout: false
                "403":
                    description: 'forbidden: The caller may not perform this action.'
                    schema:
                        $ref: '#/definitions/OrdersApproveRefundForbiddenResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: forbidden
                            temporary: false
                            timeout: false
                "404":
                    description: 'not_found: The run or approval does not exist.'
                    schema:
                        $ref: '#/definitions/OrdersApproveRefundNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
                "422":
                    description: 'invalid_refund: The refund breaks a business rule.'
                    schema:
                        $ref: '#/definitions/OrdersApproveRefundInvalidRefundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: invalid_refund
                            temporary: false
                            timeout: false
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /tenants/{tenant_id}/customers/{customer_id}/orders:
        get:
            tags:
                - commerce
            summary: list_orders commerce
            description: List one page of a customer's orders, newest first.
            operationId: commerce#list_orders
            parameters:
                - name: cursor
                  in: query
                  description: Cursor returned by the previous page.
                  required: false
                  type: string
                - name: limit
                  in: query
                  description: Maximum orders to return.
                  required: false
                  type: integer
                  default: 20
                  maximum: 50
                  minimum: 1
                - name: tenant_id
                  in: path
                  description: Merchant tenant.
                  required: true
                  type: string
                  minLength: 1
                - name: customer_id
                  in: path
                  description: Customer whose orders to list.
                  required: true
                  type: string
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/OrderPage'
                        required:
                            - orders
                            - total
            schemes:
                - http
    /tenants/{tenant_id}/customers/{customer_id}/orders/{order_id}:
        get:
            tags:
                - commerce
            summary: get_order commerce
            description: Load one of a customer's orders. Orders of other customers are not found.
            operationId: commerce#get_order
            parameters:
                - name: tenant_id
                  in: path
                  description: Merchant tenant.
                  required: true
                  type: string
                  minLength: 1
                - name: customer_id
                  in: path
                  description: Customer who must own the order.
                  required: true
                  type: string
                  minLength: 1
                - name: order_id
                  in: path
                  description: Order to load.
                  required: true
                  type: string
                  minLength: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Order'
                        required:
                            - id
                            - placed_at
                            - items_cents
                            - tax_cents
                            - shipping_cents
                            - total_cents
                "404":
                    description: 'not_found: The customer has no such order.'
                    schema:
                        $ref: '#/definitions/CommerceGetOrderNotFoundResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: not_found
                            temporary: false
                            timeout: false
            schemes:
                - http
    /tenants/{tenant_id}/refunds:
        post:
            tags:
                - payments
            summary: refund payments
            description: Refund an order. A repeated idempotency key returns the original receipt.
            operationId: payments#refund
            parameters:
                - name: tenant_id
                  in: path
                  description: Merchant tenant.
                  required: true
                  type: string
                  minLength: 1
                - name: Idempotency-Key
                  in: header
                  description: Key that identifies this refund across retries.
                  required: true
                  type: string
                  minLength: 1
                - name: RefundRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/PaymentsRefundRequestBody'
                    required:
                        - order_id
                        - amount_cents
                        - method
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Receipt'
                        required:
                            - receipt_id
                            - order_id
                            - amount_cents
                            - method
            schemes:
                - http
