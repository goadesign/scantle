    PaymentsRefundRequestBody:
        title: PaymentsRefundRequestBody
        type: object
        properties:
            amount_cents:
                type: integer
                description: Amount to refund in cents.
                example: 526595256696119958
                format: int64
                minimum: 1
            method:
                type: string
                description: How to return the money.
                example: store_credit
                enum:
                    - store_credit
                    - card
            order_id:
                type: string
                description: Order to refund.
                example: 7g
                minLength: 1
        example:
            amount_cents: 526595256696119958
            method: store_credit
            order_id: 7g
        required:
            - order_id
            - amount_cents
            - method
    PromptVersion:
        title: PromptVersion
        type: object
        properties:
            prompt_id:
                type: string
                description: Prompt that was replaced.
                example: At id autem tenetur rem aut.
            version:
                type: string
                description: 'Version of the accepted text: "sha256:" followed by the hex SHA-256 of the template. Model requests that use this text carry this version.'
                example: Fuga quos quia.
        example:
            prompt_id: At id autem tenetur rem aut.
            version: Fuga quos quia.
        required:
            - prompt_id
            - version
    Receipt:
        title: Receipt
        type: object
        properties:
            amount_cents:
                type: integer
                description: Refunded amount in cents.
                example: 8316934806901576493
                format: int64
                minimum: 1
            method:
                type: string
                description: How the money was returned.
                example: store_credit
                enum:
                    - store_credit
                    - card
            order_id:
                type: string
                description: Refunded order.
                example: zq
                minLength: 1
            receipt_id:
                type: string
                description: Provider receipt identifier.
                example: "1"
                minLength: 1
        description: The payment provider's record of a refund.
        example:
            amount_cents: 8316934806901576493
            method: store_credit
            order_id: zq
            receipt_id: "1"
        required:
            - receipt_id
            - order_id
            - amount_cents
            - method
    RunView:
        title: RunView
        type: object
        properties:
            approval_id:
                type: string
                description: Pending approval to decide when status is awaiting_approval.
                example: Vel dolores aut dolore tempora deserunt.
            approval_prompt:
                type: string
                description: What the manager is asked to approve.
                example: Consequuntur eveniet at.
            reply:
                type: string
                description: Assistant reply once the run completes.
                example: Doloremque deleniti.
            run_id:
                type: string
                description: Run identifier.
                example: Iste aut enim et in beatae.
            status:
                type: string
                description: Run state.
                example: running
                enum:
                    - running
                    - awaiting_approval
                    - completed
                    - failed
        description: State of a refund assistant run.
        example:
            approval_id: Vel dolores aut dolore tempora deserunt.
            approval_prompt: Consequuntur eveniet at.
            reply: Doloremque deleniti.
            run_id: Iste aut enim et in beatae.
            status: running
        required:
            - run_id
            - status
securityDefinitions:
    jwt_header_Authorization:
        type: apiKey
        description: |-
            Bearer token issued by the merchant's identity provider.

            **Security Scopes**:
              * `orders:chat`: Talk to the refund assistant about your own orders.
              * `refunds:approve`: Approve or deny refunds that need a manager.
              * `prompts:manage`: Change the refund agent's prompts for every tenant.
        name: Authorization
        in: header
