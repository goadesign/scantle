    CommerceGetOrderNotFoundResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: false
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: true
        description: Error response result type (default view)
        example:
            fault: false
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: true
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    Order:
        title: Order
        type: object
        properties:
            id:
                type: string
                description: Order identifier.
                example: "0"
                minLength: 1
            items_cents:
                type: integer
                description: Item subtotal in cents.
                example: 3150286796042693468
                format: int64
                minimum: 0
            placed_at:
                type: string
                description: When the order was placed.
                example: "2008-09-21T01:31:00Z"
                format: date-time
            shipping_cents:
                type: integer
                description: Shipping charged in cents.
                example: 6193610867283962899
                format: int64
                minimum: 0
            tax_cents:
                type: integer
                description: Tax charged in cents.
                example: 5943857639072305571
                format: int64
                minimum: 0
            total_cents:
                type: integer
                description: Total charged in cents, including tax and shipping.
                example: 6277315588612917884
                format: int64
                minimum: 0
        description: A customer order with its charged amounts in cents.
        example:
            id: "0"
            items_cents: 3150286796042693468
            placed_at: "2008-09-21T01:31:00Z"
            shipping_cents: 6193610867283962899
            tax_cents: 5943857639072305571
            total_cents: 6277315588612917884
        required:
            - id
            - placed_at
            - items_cents
            - tax_cents
            - shipping_cents
            - total_cents
    OrderPage:
        title: OrderPage
        type: object
        properties:
            next_cursor:
                type: string
                description: Cursor for the next page; absent on the last page.
                example: Saepe praesentium ut quia.
            orders:
                type: array
                items:
                    $ref: '#/definitions/Order'
                description: Orders on this page.
                example:
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
                    - id: "0"
                      items_cents: 3150286796042693468
                      placed_at: "2008-09-21T01:31:00Z"
                      shipping_cents: 6193610867283962899
                      tax_cents: 5943857639072305571
                      total_cents: 6277315588612917884
            total:
                type: integer
                description: Number of orders the customer has in total.
                example: 8917658905915546728
                format: int64
                minimum: 0
        description: One page of a customer's orders, newest first.
        example:
            next_cursor: Saepe praesentium ut quia.
            orders:
                - id: "0"
                  items_cents: 3150286796042693468
                  placed_at: "2008-09-21T01:31:00Z"
                  shipping_cents: 6193610867283962899
                  tax_cents: 5943857639072305571
                  total_cents: 6277315588612917884
                - id: "0"
                  items_cents: 3150286796042693468
                  placed_at: "2008-09-21T01:31:00Z"
                  shipping_cents: 6193610867283962899
                  tax_cents: 5943857639072305571
                  total_cents: 6277315588612917884
                - id: "0"
                  items_cents: 3150286796042693468
                  placed_at: "2008-09-21T01:31:00Z"
                  shipping_cents: 6193610867283962899
                  tax_cents: 5943857639072305571
                  total_cents: 6277315588612917884
                - id: "0"
                  items_cents: 3150286796042693468
                  placed_at: "2008-09-21T01:31:00Z"
                  shipping_cents: 6193610867283962899
                  tax_cents: 5943857639072305571
                  total_cents: 6277315588612917884
            total: 8917658905915546728
        required:
            - orders
            - total
